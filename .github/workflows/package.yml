name: package

on:
  workflow_call:
    inputs:
      sid-version:
        type: string
        required: true
      upstream-version:
        type: string
        required: true
      rebuild-version:
        type: string
        required: true
      tag:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decision.outputs.build }}
      image: ${{ steps.image.outputs.image }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: decision
        run: scripts/build-needed "$TAG" >> "$GITHUB_OUTPUT"
      - id: image
        run: scripts/image-needed "$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    env:
      DEBIAN_FRONTEND: noninteractive
      DEBFULLNAME: Philipp Kretzschmar
      DEBEMAIL: philipp.kretzschmar@gmail.com
      SID_VERSION: ${{ inputs.sid-version }}
      UPSTREAM_VERSION: ${{ inputs.upstream-version }}
      REBUILD_VERSION: ${{ inputs.rebuild-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: scripts/install-build-tools
      - run: scripts/enable-sid-sources
      - run: scripts/build-deb "$SID_VERSION" "$UPSTREAM_VERSION" "$REBUILD_VERSION" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packages-${{ inputs.tag }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: packages-${{ inputs.tag }}
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REBUILD_VERSION: ${{ inputs.rebuild-version }}
          SID_VERSION: ${{ inputs.sid-version }}
          UPSTREAM_VERSION: ${{ inputs.upstream-version }}
        run: scripts/publish-release "$TAG" "$REBUILD_VERSION" "$SID_VERSION" "$UPSTREAM_VERSION" dist

  image:
    needs: [decide, release]
    if: always() && needs.decide.outputs.image == 'true' && (needs.release.result == 'success' || needs.decide.outputs.build == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REBUILD_VERSION: ${{ inputs.rebuild-version }}
        run: scripts/publish-image "$TAG" "$REBUILD_VERSION"
