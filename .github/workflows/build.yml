name: build

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    outputs:
      builds: ${{ steps.versions.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: scripts/enable-sid-sources
      - run: apt-get install --yes --no-install-recommends ca-certificates curl
      - id: versions
        run: scripts/resolve-versions >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.resolve.outputs.builds) }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/package.yml
    with:
      sid-version: ${{ matrix.build.sid_version }}
      upstream-version: ${{ matrix.build.upstream_version }}
      rebuild-version: ${{ matrix.build.rebuild_version }}
      tag: ${{ matrix.build.tag }}
